Description:
  Slug: OS
  ShortName: OS
  LongName: Optimization Services
  ShortDescription: A set of standards and libraries for representing optimization instances, results, and solver options, and for communication between clients and solvers.
  LongDescription: |2
    The objective of Optimization Services (OS) is to provide a set of
    standards for representing optimization instances, results, solver
    options, and communication between clients and solvers in a distributed
    environment using Web Services. This COIN-OR project provides source code
    for libraries and executable programs that implement OS standards.
  Manager: Horand Gassmann
  Homepage: https://github.com/coin-or/OS
  License: Eclipse Public License 2.0
  LicenseURL: http://www.opensource.org/licenses/EPL-2.0
  Zenodo:
  IncludedIn:
    Package: OS
  Language:
    - C++
  Categories:
    - Optimization deterministic linear continuous
    - Optimization deterministic linear discrete
    - Optimization deterministic nonlinear
    - Interfaces

